<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webcreator1117</title>

<!-- 🌐 World Wide Web emoji as browser/bookmark icon -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext x='32' y='50' text-anchor='middle' font-size='50'%3E🌐%3C/text%3E%3C/svg%3E">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    background:
        radial-gradient(circle at 50% 35%, rgba(0,200,255,.22), transparent 25%),
        radial-gradient(circle at 15% 20%, rgba(70,40,255,.18), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(0,180,255,.15), transparent 25%),
        linear-gradient(180deg, #01030b 0%, #071936 50%, #020611 100%);
}

/* Stars */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        radial-gradient(circle at 8% 12%, white 1px, transparent 2px),
        radial-gradient(circle at 18% 30%, white 1px, transparent 2px),
        radial-gradient(circle at 28% 12%, white 1px, transparent 2px),
        radial-gradient(circle at 38% 24%, white 1px, transparent 2px),
        radial-gradient(circle at 48% 10%, white 1px, transparent 2px),
        radial-gradient(circle at 58% 27%, white 1px, transparent 2px),
        radial-gradient(circle at 68% 13%, white 1px, transparent 2px),
        radial-gradient(circle at 78% 30%, white 1px, transparent 2px),
        radial-gradient(circle at 88% 11%, white 1px, transparent 2px),
        radial-gradient(circle at 94% 38%, white 1px, transparent 2px);
    opacity: .9;
}

/* Mountain shapes */
.mountains {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 35%;
    pointer-events: none;
}

.mountain {
    position: absolute;
    bottom: 0;
    width: 0;
    height: 0;
    border-left: 190px solid transparent;
    border-right: 190px solid transparent;
    border-bottom: 260px solid #020817;
}

.m1 { left: -100px; transform: scale(1.5); }
.m2 { left: 8%; transform: scale(.9); }
.m3 { left: 25%; transform: scale(1.2); }
.m4 { right: 24%; transform: scale(1.25); }
.m5 { right: 7%; transform: scale(.95); }
.m6 { right: -120px; transform: scale(1.5); }

/* Blue horizon */
.horizon {
    position: fixed;
    left: 50%;
    bottom: 16%;
    width: 100%;
    height: 250px;
    transform: translateX(-50%);
    background: radial-gradient(
        ellipse,
        rgba(0,180,255,.28),
        transparent 65%
    );
    filter: blur(25px);
    pointer-events: none;
}

/* Navigation */
.nav {
    position: fixed;
    top: 25px;
    right: 35px;
    z-index: 10;
    display: flex;
    gap: 28px;
}

.nav button {
    border: 0;
    background: transparent;
    color: #bdd8ff;
    font-size: 14px;
    cursor: pointer;
}

.nav button:hover {
    color: #43d9ff;
}

/* Main */
.container {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

/* THE ACTUAL WEB EMOJI */
.web-emoji {
    font-size: 92px;
    line-height: 1;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 18px rgba(0,200,255,.75));
}

/* Brand */
.logo {
    font-size: clamp(45px, 7vw, 88px);
    font-weight: 800;
    letter-spacing: -3px;
    text-shadow:
        0 0 15px rgba(255,255,255,.2),
        0 0 45px rgba(0,140,255,.55);
}

.logo span {
    color: #00c8ff;
}

.subtitle {
    margin-top: 12px;
    color: #bddcff;
    letter-spacing: 6px;
    font-size: 16px;
}

/* Launch */
.launch {
    margin-top: 48px;
    padding: 23px 48px;
    min-width: 360px;

    border: 2px solid #61dcff;
    border-radius: 22px;

    background: linear-gradient(135deg, #087fff, #3139d8);

    color: white;
    font-size: 23px;
    font-weight: bold;
    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(0,200,255,.9),
        0 0 45px rgba(0,100,255,.65);

    transition: .2s;
}

.launch:hover {
    transform: scale(1.06);
    box-shadow:
        0 0 25px rgba(0,220,255,1),
        0 0 70px rgba(0,100,255,.85);
}

/* Feature buttons */
.features {
    display: flex;
    gap: 55px;
    margin-top: 55px;
}

.feature {
    border: 0;
    background: transparent;
    color: #a9c8ed;
    cursor: pointer;
    text-align: center;
}

.feature-icon {
    font-size: 30px;
    color: #62dcff;
    margin-bottom: 8px;
}

.feature-title {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
}

.feature:hover {
    color: white;
}

/* Footer */
.footer {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(190,220,255,.5);
    font-size: 10px;
    letter-spacing: 4px;
}

@media (max-width: 700px) {
    .nav {
        display: none;
    }

    .launch {
        min-width: 280px;
        font-size: 19px;
    }

    .features {
        gap: 20px;
    }

    .web-emoji {
        font-size: 70px;
    }
}
</style>
</head>

<body>

<div class="horizon"></div>

<div class="mountains">
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
    <div class="mountain m3"></div>
    <div class="mountain m4"></div>
    <div class="mountain m5"></div>
    <div class="mountain m6"></div>
</div>

<div class="nav">
    <button onclick="showMessage('Home')">Home</button>
    <button onclick="showMessage('About')">About</button>
    <button onclick="showMessage('Features')">Features</button>
    <button onclick="showMessage('Contact')">Contact</button>
</div>

<div class="container">

    <div class="web-emoji">🌐</div>

    <div class="logo">
        Webcreator<span>1117</span>
    </div>

    <div class="subtitle">
        YOUR WEBSITE · ONE CLICK AWAY
    </div>

    <button class="launch" onclick="launchWebsite()">
        🚀 LAUNCH WEBSITE
    </button>

    <div class="features">

        <button class="feature" onclick="showMessage('Fast')">
            <div class="feature-icon">⚡</div>
            <div class="feature-title">FAST</div>
        </button>

        <button class="feature" onclick="showMessage('Secure')">
            <div class="feature-icon">🔒</div>
            <div class="feature-title">SECURE</div>
        </button>

        <button class="feature" onclick="showMessage('Online')">
            <div class="feature-icon">◎</div>
            <div class="feature-title">ONLINE</div>
        </button>

    </div>

</div>

<div class="footer">
    WEBCREATOR1117 · BUILDING A BETTER WEB
</div>

<script>

function launchWebsite() {

    const tab = window.open("", "_blank");

    if (!tab) {
        alert("Please allow pop-ups for this website.");
        return;
    }

    tab.document.open();

    tab.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Webcreator1117</title>

            <style>
                html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    background: black;
                    overflow: hidden;
                }

                iframe {
                    width: 100%;
                    height: 100%;
                    border: 0;
                }
            </style>
        </head>

        <body>

            <iframe
                src="https://webcreator1117-official-web.ai.studio"
                allow="fullscreen">
            </iframe>

        </body>
        </html>
    `);

    tab.document.close();
}

function showMessage(name) {
    alert(name + " button clicked");
}

</script>

</body>
</html>
