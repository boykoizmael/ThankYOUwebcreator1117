<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Webcreator1117</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background:
        radial-gradient(circle at 50% 45%, rgba(0,180,255,.25), transparent 30%),
        linear-gradient(180deg, #020617, #071b3d 50%, #020617);
}

/* Stars */
.stars {
    position: fixed;
    inset: 0;
    background-image:
        radial-gradient(2px 2px at 10% 20%, white, transparent),
        radial-gradient(2px 2px at 25% 70%, white, transparent),
        radial-gradient(1px 1px at 40% 30%, white, transparent),
        radial-gradient(2px 2px at 60% 15%, white, transparent),
        radial-gradient(1px 1px at 75% 60%, white, transparent),
        radial-gradient(2px 2px at 90% 25%, white, transparent),
        radial-gradient(1px 1px at 80% 85%, white, transparent),
        radial-gradient(2px 2px at 15% 90%, white, transparent);
}

/* Center glow */
.glow {
    position: fixed;
    left: 50%;
    top: 50%;
    width: 700px;
    height: 700px;
    transform: translate(-50%, -50%);
    background: radial-gradient(
        circle,
        rgba(0,140,255,.2),
        transparent 65%
    );
    filter: blur(30px);
}
