<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcreator1117</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: linear-gradient(135deg, #020617, #0b3b70);
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

button {
    padding: 25px 50px;
    font-size: 26px;
    font-weight: bold;

    color: white;
    background: #087cff;

    border: 3px solid #8bd9ff;
    border-radius: 18px;

    cursor: pointer;

    box-shadow: 0 0 30px rgba(0,150,255,.8);
}

button:hover {
    transform: scale(1.05);
}
</style>

</head>

<body>

<button id="launchButton">
🚀 LAUNCH WEBSITE
</button>

<script>
document.getElementById("launchButton").addEventListener("click", function () {

    /* Open a real new tab.
       Because no URL is supplied, it starts as about:blank. */
    const newTab = window.open("", "_blank");

    if (!newTab) {
        alert("The browser blocked the new tab. Allow pop-ups for this site.");
        return;
    }

    /* Create the page inside about:blank */
    newTab.document.title = "Webcreator1117";

    newTab.document.body.style.margin = "0";
    newTab.document.body.style.width = "100vw";
    newTab.document.body.style.height = "100vh";
    newTab.document.body.style.overflow = "hidden";
    newTab.document.body.style.background = "black";

    const iframe = newTab.document.createElement("iframe");

    iframe.src = "https://webcreator1117-official-web.ai.studio";

    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "0";

    iframe.allow = "fullscreen";

    newTab.document.body.appendChild(iframe);
});
</script>

</body>
</html>
