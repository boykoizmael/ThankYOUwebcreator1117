<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcreator1117 Launcher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .launcher {
            background: white;
            padding: 25px 30px;
            border-radius: 14px;
            border: 1px solid #ddd;
            box-shadow: 0 6px 25px rgba(0,0,0,.15);
            text-align: center;
        }

        .title {
            font-size: 21px;
            font-weight: bold;
            color: #111;
            margin-bottom: 18px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 20px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="launcher">
        <div class="title">
            Webcreator1117 Website →
        </div>

        <button onclick="launchWebsite()">
            Launch Website
        </button>
    </div>

    <script>
        function launchWebsite() {
            const newTab = window.open("about:blank", "_blank");

            if (!newTab) {
                alert("Please allow pop-ups for this website.");
                return;
            }

            newTab.document.open();

            newTab.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Webcreator1117</title>
                    <style>
                        html, body {
                            margin: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                        }

                        iframe {
                            width: 100%;
                            height: 100%;
                            border: 0;
                        }
                    </style>
                </head>

                <body>
                    <iframe
                        src="https://webcreator1117-official-web.ai.studio"
                        allowfullscreen>
                    </iframe>
                </body>
                </html>
            `);

            newTab.document.close();
        }
    </script>

</body>
</html>
