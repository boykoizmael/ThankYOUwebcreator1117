<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcreator1117</title>
<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050b24;
    font-family: Arial, Helvetica, sans-serif;
}

.screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-image: url("background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.launch-hitbox {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    width: min(28vw, 430px);
    height: min(8vw, 115px);
    min-width: 260px;
    min-height: 70px;
    border: 0;
    background: transparent;
    cursor: pointer;
    border-radius: 30px;
}

.launch-hitbox:focus-visible {
    outline: 3px solid white;
    outline-offset: 5px;
}

.hint {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.7);
    font-size: 12px;
    letter-spacing: 2px;
    text-align: center;
    pointer-events: none;
}

@media (max-width: 700px) {
    .launch-hitbox {
        width: 70vw;
        height: 80px;
    }
}
</style>
</head>

<body>
<div class="screen">
    <button
        class="launch-hitbox"
        aria-label="Launch Webcreator1117"
        onclick="launchWebsite()">
    </button>

    <div class="hint">CLICK THE LAUNCH BUTTON TO BEGIN</div>
</div>

<script>
function launchWebsite() {
    const tab = window.open("about:blank", "_blank");

    if (!tab) {
        alert("Your browser blocked the new tab. Please allow pop-ups for this launcher.");
        return;
    }

    tab.document.open();
    tab.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Webcreator1117</title>
            <style>
                html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                    background: black;
                }
                iframe {
                    width: 100%;
                    height: 100%;
                    border: 0;
                }
            </style>
        </head>
        <body>
            <iframe
                src="https://webcreator1117-official-web.ai.studio"
                allow="fullscreen">
            </iframe>
        </body>
        </html>
    `);
    tab.document.close();
}
</script>
</body>
</html>
